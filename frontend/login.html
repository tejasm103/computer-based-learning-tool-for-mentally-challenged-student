<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In — AccessibleVerse</title>
  <meta name="description" content="Sign in to AccessibleVerse to track your learning progress, earn XP, and sync game high scores.">

  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/accessibility.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body>
  <a href="#main-content" class="skip-to-content">Skip to Main Content</a>

  <!-- Header -->
  <header class="navbar" role="banner">
    <div class="nav-container">
      <a href="index.html" class="nav-brand">
        <div class="brand-cube"><i data-lucide="box"></i></div>
        <span>Accessible<span class="highlight">Verse</span></span>
      </a>

      <div class="nav-actions">
        <div class="lang-picker-group" role="group" aria-label="Language selection" style="display: flex; gap: 0.3rem;">
          <button class="btn btn-sm btn-secondary lang-btn active" data-lang="en">EN</button>
          <button class="btn btn-sm btn-secondary lang-btn" data-lang="kn">ಕನ್ನಡ</button>
          <button class="btn btn-sm btn-secondary lang-btn" data-lang="hi">हिंदी</button>
        </div>
        <a href="register.html" class="btn btn-primary btn-sm" data-i18n="nav_register">Join Free</a>
      </div>
    </div>
  </header>

  <main id="main-content" class="main-content" style="display: flex; align-items: center; justify-content: center; min-height: calc(100vh - var(--nav-height) - 100px); padding: 3rem 1.5rem;">
    <div class="card card-glass" style="max-width: 460px; width: 100%; padding: 2.5rem; box-shadow: var(--shadow-lg);">
      <div style="text-align: center; margin-bottom: 2rem;">
        <div class="brand-cube" style="margin: 0 auto 1rem; width: 44px; height: 44px;">
          <i data-lucide="lock"></i>
        </div>
        <h1 style="font-size: 1.8rem;">Welcome Back</h1>
        <p style="margin-top: 0.35rem; font-size: 0.95rem;">Enter your credentials to access your dashboard.</p>
      </div>

      <!-- Quick Demo Login Helpers for Beginner Testing -->
      <div style="background: var(--bg-hover); padding: 0.9rem; border-radius: var(--radius-md); margin-bottom: 1.5rem; text-align: center; border: 1px dashed var(--border-color);">
        <span style="font-size: 0.8rem; font-weight: 600; color: var(--text-muted); display: block; margin-bottom: 0.5rem;">⚡ Quick Demo Testing Login:</span>
        <div style="display: flex; gap: 0.5rem; justify-content: center;">
          <button type="button" class="btn btn-sm btn-secondary" onclick="fillDemoLogin('student')">
            <i data-lucide="user"></i> Demo Student
          </button>
          <button type="button" class="btn btn-sm btn-secondary" onclick="fillDemoLogin('teacher')">
            <i data-lucide="graduation-cap"></i> Demo Teacher
          </button>
        </div>
      </div>

      <form id="login-form">
        <div class="form-group">
          <label class="form-label" for="login-identifier">Username or Email</label>
          <input type="text" id="login-identifier" class="form-input" placeholder="e.g. explorer or name@mail.com" required autocomplete="username">
        </div>

        <div class="form-group">
          <label class="form-label" for="login-password">Password</label>
          <input type="password" id="login-password" class="form-input" placeholder="••••••••" required autocomplete="current-password">
        </div>

        <button type="submit" class="btn btn-primary btn-lg" style="width: 100%; margin-top: 1rem;">
          <i data-lucide="log-in"></i> Sign In to AccessibleVerse
        </button>
      </form>

      <div style="text-align: center; margin-top: 1.75rem; font-size: 0.9rem; color: var(--text-muted);">
        Don't have an account yet? <a href="register.html" style="font-weight: 600;">Create one free</a>
      </div>
    </div>
  </main>

  <footer class="footer" role="contentinfo">
    <div class="container">
      <div class="footer-bottom">
        <div>&copy; 2026 AccessibleVerse — Secure Student & Teacher Authentication.</div>
      </div>
    </div>
  </footer>

  <!-- Scripts -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/language.js"></script>
  <script src="js/accessibility.js"></script>
  <script src="js/app.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
